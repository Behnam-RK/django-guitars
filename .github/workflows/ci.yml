name: CI

# Runs the checks CI is meant to gate on:
#   - pre-commit run --all-files (lint, format, type check, security scan)
#   - the pytest suite at 100% coverage, against a real Postgres (see compose.yaml --
#     the kit's soft-delete, updated_at and tenancy behavior is enforced by Postgres
#     rules, triggers and row-level security, so there is no SQLite fallback).
#   - `makemigrations --check`, so a model change cannot land without the enforcement
#     migrations that make its behaviour real, and `audittenancy --require-force --require-match`, so
#     the policies are proven to actually bind on a migrated database.
#
# NOTE: DJANGO_SETTINGS_MODULE is exported for the management commands, and that is
# load-bearing. manage.py uses os.environ.setdefault('DJANGO_SETTINGS_MODULE',
# 'core.settings'), and core.settings has LOCAL_APPS = [] -- so without it
# `makemigrations --check` reports "No changes detected" and `audittenancy` reports
# "0 table(s) expected ... passed", both green having examined nothing.
#
# The `test` job runs a matrix, not a single cell: pyproject.toml's classifiers claim
# Python 3.10-3.14 (5 versions) x Django 5.0-6.0 (5.0/5.1/5.2/6.0, 4 versions) = 20
# advertised cells, and until this matrix existed only 1 of them was ever verified by
# anything. This matrix doesn't attempt full 20-cell coverage -- it samples the floor,
# a midpoint, and the ceiling of each axis (Python 3.10/3.12/3.14, Django 5.0/5.2/6.0),
# skipping 3.11/3.13/5.1 entirely, on the theory that a regression tied to one specific
# minor version and no other is rare enough not to be worth 20 jobs per push. That's a
# cross product of 18 minus the one combination pip itself refuses (Django 6.0 requires
# Python >=3.12 -- confirmed by trying to install it under 3.10, not assumed), times two
# Postgres majors so the kit's own rules/triggers/RLS are proven across more than one
# server version too -- 16 cells actually run. `uv sync --locked` still seeds the job
# from the committed lockfile (every other dependency), then `uv pip install
# "Django==X.*"` overrides just Django for that cell -- deliberately not `uv run
# --with`, which only overrides the one invocation it wraps, and every later step in
# this job (migrations, audit) needs to see the same overridden Django the tests just
# ran against; `env.UV_NO_SYNC` below is what stops each of those `uv run` steps from
# silently resyncing that override back to the lockfile's Django.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  test:
    name: Test (py${{ matrix.python-version }}, dj${{ matrix.django-version }}, pg${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    env:
      # Every `uv run` after the Django pin below must NOT resync from the lockfile --
      # that would silently revert the pin back to whatever Django uv.lock resolved,
      # collapsing all three django-version cells for a given Python onto one actual
      # version. Verified empirically: without this, `uv run python -c "import django;
      # print(django.__version__)"` after `uv pip install "Django==5.0.*"` reports the
      # *lockfile's* Django, not 5.0.x.
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        django-version: ["5.0", "5.2", "6.0"]
        postgres-version: ["14", "18"]
        exclude:
          # Django 6.0 requires Python >=3.12 -- verified by trying to install it
          # under 3.10 (uv reports the requirement as unsatisfiable), not assumed.
          # Every other cell in the cross product installs successfully; whether it
          # also *runs* correctly is exactly what the rest of this matrix finds out.
          - python-version: "3.10"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Pin this cell's Django version
        run: uv pip install "Django==${{ matrix.django-version }}.*"

      - name: Start Postgres
        env:
          POSTGRES_VERSION: ${{ matrix.postgres-version }}
        run: docker compose up -d --wait

      - name: Run tests
        run: uv run pytest -n auto --cov=guitars --cov-report=term-missing --cov-report=html

      - name: Check migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: uv run python manage.py makemigrations --check

      - name: Check the tenancy policies bind on a migrated database
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: |
          uv run python manage.py migrate
          uv run python manage.py audittenancy --require-force --require-match

      - name: Upload coverage report
        # One canonical cell, not all 16: fail_under is a single number, not
        # per-cell, so one unambiguous artifact to inspect in the PR/Actions UI
        # beats fifteen near-identical ones. Floor versions, so the artifact
        # reflects the widest-compatibility cell rather than the newest one.
        # The HTML report (not the raw .coverage data file) so a reviewer can open
        # it and see which lines/branches a drop actually came from, not just the
        # percentage.
        if: |
          matrix.python-version == '3.10' &&
          matrix.django-version == '5.0' &&
          matrix.postgres-version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
