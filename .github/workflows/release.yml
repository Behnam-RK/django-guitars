name: Release and Publish

# The manual and tag-push face of releasing. The release itself is cut by
# _create-release.yml, which this calls -- see that file for why it is separate
# (short version: a called workflow's permissions are validated statically, so
# the `publish` job below would otherwise force OIDC onto the automated path).
#
# Triggers:
#   - push of a vX.Y.Z tag -- for a tag pushed by a human (scripts/release.sh).
#     A tag pushed by tag-release.yml does NOT arrive here: GitHub suppresses
#     workflow triggers for events created with the default GITHUB_TOKEN, which
#     is why that workflow calls _create-release.yml directly instead of relying
#     on this trigger. Harmless if both ever reach the same tag -- the release
#     step creates or edits, whichever is needed.
#   - manual run (workflow_dispatch) against an existing tag, picked from the
#     "Use workflow from" ref selector above (a dropdown/search box over
#     branches and tags -- there's no free-text `tag` input, so it's always
#     current). Rebuilds the release notes, and additionally publishes to
#     PyPI if the `publish` input is checked.
#
# Publishing to PyPI is manual-only and always has been: it lives in a job
# gated on `workflow_dispatch` *and* the opt-in input, and the automated path
# reaches this file not at all.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish this tag to PyPI'
        type: boolean
        default: false

permissions:
  contents: write  # required to create the release

jobs:
  release:
    name: Cut the GitHub release
    # `github.ref_name` is the tag on both triggers: a tag push, and a manual
    # run whose ref selector was pointed at one (enforced inside).
    uses: ./.github/workflows/_create-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write

  publish:
    name: Build and publish to PyPI (Trusted Publishing)
    needs: release
    # Manual runs only, and only with the box ticked. This job is the reason
    # _create-release.yml is a separate file: `id-token: write` is granted
    # statically, so a caller that cannot grant OIDC cannot call a workflow
    # containing it, `if:` or no `if:`.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
