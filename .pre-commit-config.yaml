# Pre-commit hooks.
#   uv run pre-commit install         # enable on every commit
#   uv run pre-commit run --all-files # run across the whole repo
#
# Astral tools (ruff/ty/bandit) run via `uv run` so they use the exact
# versions pinned in pyproject.toml / uv.lock — one source of truth.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # syrupy's .ambr snapshots use a leading-space indent to represent a blank line
      # *inside* the snapshotted string (as distinct from one that ends the block), so
      # trimming it silently corrupts the snapshot into a stored value the code under
      # test no longer produces -- see tests/__snapshots__/.
      - id: trailing-whitespace
        exclude: '\.ambr$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.18
    hooks:
      - id: uv-lock  # keep uv.lock in sync with pyproject.toml

  # Workflow linting. Note what this does NOT catch: actionlint models one file
  # at a time, so it passed cleanly on the reusable-workflow call that failed at
  # startup with "the nested job 'publish' is requesting 'id-token: write'"
  # (see CLAUDE.md on the release wiring). Cross-workflow permission validation
  # is GitHub's alone, and is still only reachable by pushing.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty type check
        entry: uv run ty check src/
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        # tests/ is out of scope, same as ruff/ty (see pyproject.toml): the
        # harness deliberately does things a security scanner would flag --
        # hardcoded creds for the local-only Postgres role, raw SQL probes of
        # generated migrations -- that are the point of the test, not a risk.
        # The shipped package is src/ alone; see CLAUDE.md.
        name: bandit security scan
        entry: uv run bandit -q -r src/
        language: system
        types: [python]
        pass_filenames: false
      - id: doc-budget
        name: doc budget
        entry: uv run python scripts/doc_budget.py
        language: system
        pass_filenames: false
