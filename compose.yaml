# Local Postgres for development and the test suite.
# The kit's soft-delete + updated_at behavior is enforced by PostgreSQL rules
# and triggers, and its tenancy feature by row-level-security policies, so a real
# Postgres is required to run/test it.
#
#   docker compose up -d
#   uv run pytest
#
# POSTGRES_USER is the image's superuser and is used only to run
# scripts/postgres-init.sql, which creates the non-superuser `guitars` role the
# suite actually connects as. A superuser bypasses RLS unconditionally, so the
# tenancy tests would pass vacuously if they ran as one -- see that file.
#
# Switching from an older checkout requires recreating the volume, because the
# init script only runs against an empty data directory:
#
#   docker compose down -v && docker compose up -d --wait
#
# POSTGRES_VERSION selects the major version (defaults to 18, today's baseline).
# CI sets it per matrix cell to prove the kit's rules/triggers/RLS hold across
# more than one PostgreSQL major; locally it's almost never worth overriding.
services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-role.sql:ro
    ports:
      - "4455:5432"
    healthcheck:
      # Checks the application role and its database, not the superuser's: the
      # init script runs after the server first accepts connections, so probing
      # `postgres` would report ready before `guitars` exists.
      test: ["CMD-SHELL", "pg_isready -U guitars -d guitars"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Opt-in: `docker compose --profile pooling up -d --wait`. Not part of the default
  # `docker compose up -d`, so ordinary local dev and most CI jobs never pay for it.
  #
  # PGBOUNCER_POOL_MODE=transaction is the point, not an arbitrary choice: session-level
  # `SET` (what guitars.tenancy.guc publishes GUCs with) does not survive across
  # statements the way it does on a direct connection under transaction pooling, which is
  # the exact risk tests/test_concurrency.py's pgbouncer tests exist to demonstrate. See
  # docs/tenancy.md and CLAUDE.md on tenancy/guc.py's cache -- this is the scenario M5's
  # fix (startup check, always-SET LOCAL, or documentation-only) will be decided against.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: [pooling]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://guitars:guitars@db:5432/guitars
      # DEFAULT_POOL_SIZE=1 is deliberate: tests/test_concurrency.py's
      # TestPgbouncerTransactionPooling relies on exactly one shared PostgreSQL backend so
      # that two sequential, non-overlapping clients are *guaranteed* to land on the same
      # session -- turning the GUC-leak-across-clients demonstration into a two-line
      # reproduction instead of a probabilistic race.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 1
      AUTH_TYPE: plain
    ports:
      - "6432:5432"
