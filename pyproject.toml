[project]
name = "django-guitars"
version = "2.2.0"
description = "A kit of reusable Django utilities: base models, PostgreSQL soft deletion, and more."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Behnam RK", email = "behnam.rk47@gmail.com" },
]
keywords = ["django", "guitars", "reusable-app"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Django>=5.0",
]

[project.optional-dependencies]
# [c], not [binary]: psycopg's own docs call [c] "the preferred method for
# production sites" -- it builds against the local libpq rather than shipping
# a bundled one. Requires build prerequisites (a C compiler, libpq headers) at
# install time; the dev group keeps [binary] instead, see below, since CI/local
# dev value the no-build-tools convenience over the production-matching build.
psycopg = ["psycopg[c]>=3.2"]

[project.urls]
Homepage = "https://github.com/Behnam-RK/django-guitars"
Repository = "https://github.com/Behnam-RK/django-guitars"
Issues = "https://github.com/Behnam-RK/django-guitars/issues"
Changelog = "https://github.com/Behnam-RK/django-guitars/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "nox>=2025.5.1",
    "ruff>=0.15.11",
    "ty>=0.0.34",
    "bandit[toml]>=1.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "pytest-django>=4.9",
    # [binary], not the project's own [psycopg] extra ([c]): CI/local dev value
    # a driver that installs without build tools over one that matches
    # production's build -- see the [project.optional-dependencies] comment.
    # [pool] adds psycopg_pool, needed only for the Django OPTIONS={"pool": True} test in
    # tests/test_concurrency.py; that test skips itself where the pin doesn't provide it.
    "psycopg[binary,pool]>=3.2",
    "django-stubs>=6.0.6,<7.0.0",
    # M2 (issue #9): behavioural-test dependencies. Dev/test-only -- the runtime
    # `dependencies` above stay Django-only.
    "hypothesis>=6.140",  # property-based fuzzing (identifiers, update() flag combinatorics)
    "syrupy>=5.0",  # snapshot testing for generated-migration text
    "pglast>=8.0",  # structural (not textual) parsing of generated policy SQL
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship ONLY the app: maps src/guitars -> top-level `guitars` in the wheel.
# core/, manage.py, and tests/ are excluded from the wheel automatically.
[tool.hatch.build.targets.wheel]
packages = ["src/guitars"]

# Explicit sdist allow-list. Without commits hatchling walks the filesystem, so
# without this it ships session/tooling junk (.remember/, caches). This includes
# enough to rebuild the wheel AND run the test suite from the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/core",
    "/tests",
    "/manage.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# **************************** UV Configuration *************************** #

[tool.uv]
required-version = ">=0.11.8"
add-bounds = "major"

# *************************** TY Configuration *************************** #

[tool.ty.src]
# tests/ is deliberately out of scope: the suite leans on Django/pytest dynamic
# patterns (monkeypatching internals, constructing unsaved/invalid model
# instances to probe a guard) that a static checker can't distinguish from real
# type errors, and the shipped package is `src/` alone -- see CLAUDE.md.
exclude = ["tests"]

[tool.ty.environment]
python = ".venv/bin/python"

# ************************** Ruff Configuration ************************** #

[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py310"
src = ["src"]
exclude = ["tests"]

[tool.ruff.lint]
fixable = ["I"]
extend-select = [
    "UP", # pyupgrade
    "F", # pyflakes
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "ASYNC", # flake8-async
    "DJ", # flake8-django
    "T100", # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T2", # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TD", # https://docs.astral.sh/ruff/rules/#flake8-todos-td
    "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "I", # https://docs.astral.sh/ruff/rules/#isort-i
    "N", # https://docs.astral.sh/ruff/rules/#pep8-naming-n
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
line-ending = "auto"
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 92

# ************************* PyTest Configuration ************************* #

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
# -n auto is deliberately NOT here: it costs ~3s of worker-spawn overhead per
# invocation (measured: 3.3s vs 0.4s for one test), which is wasted on the single-test
# workflow this project's own docs recommend (`pytest tests/test_base.py::test_x`).
# CI and `noxfile.py` pass it explicitly on the full-suite run, where the parallelism
# pays for itself.
addopts = "-q --no-header --tb=short -ra --strict-markers --strict-config --junit-xml=.pytest-last.xml"
xfail_strict = true
filterwarnings = ["error"]

# ************************ Coverage Configuration ************************ #

[tool.coverage.run]
source = ["guitars"]
branch = true
# Several tests in test_ladder.py deliberately run in subprocesses (import-time,
# settings-dependent module state can't be probed any other way -- see that file's
# module docstring). parallel=true plus COVERAGE_PROCESS_START (set in
# tests/conftest.py) makes those subprocesses record their own coverage data, which
# pytest-cov then combines with the main process's at session end. Without this, the
# branches those subprocesses exercise (e.g. GuitarModel with no tenant model
# configured) would read as untested even though real assertions cover them.
parallel = true
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
# The kit's whole claim is that behaviour is enforced rather than hoped for, and an
# unexercised enforcement path is indistinguishable from an absent one. CI runs pytest
# with --cov, so this is the gate; a new branch ships with a test or does not ship.
fail_under = 100
